<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' blob:; worker-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: http: https:;">
  <link rel="stylesheet" href="./shared/dmTheme.css">
  <link rel="stylesheet" href="./shared/appCodicon.css">
  <script>
    (function loadScriptEditorInterface() {
      if (typeof require !== 'function') {
        const bridge = document.createElement('script');
        bridge.type = 'module';
        bridge.src = '/browser-esm/src/shell-web/browserPreloadBridge.js';
        document.head.appendChild(bridge);

        const script = document.createElement('script');
        script.type = 'module';
        script.src = '/browser-esm/src/base-app/modules/scriptEditorInterface.js';
        document.head.appendChild(script);
        return;
      }

      if (window.dialogForge && typeof window.dialogForge.loadScriptEditorPage === 'function') {
        window.dialogForge.loadScriptEditorPage();
        return;
      }
      console.error('SCRIPT-EDITOR-ERR loader failed: Electron page loader is unavailable.');
    })();
  </script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ececec;
      overflow: hidden;
    }
    #root {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .dm-script-toolbar {
      height: 34px;
      flex: 0 0 34px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
      border-bottom: 1px solid #d2d2d2;
      background: #f3f3f3;
      box-sizing: border-box;
    }

    .dm-script-toolbar .dm-divider {
      width: 1px;
      height: 16px;
      background: #dadada;
      margin: 0 2px;
    }

    .dm-script-toolbar .dm-script-btn {
      height: 24px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #2f2f2f;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 6px;
      font-size: 12px;
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, 'Noto Sans', 'Liberation Sans', sans-serif;
      position: relative;
    }

    .dm-script-toolbar .dm-script-btn[hidden] {
        display: none;
    }

    .dm-script-toolbar .dm-script-btn:hover {
      background: #e4e4e4;
    }

    .dm-script-toolbar .dm-script-btn:active {
      background: #d6d6d6;
    }

    .dm-script-toolbar .dm-script-btn-share-live[data-state="hosting"] {
      background: #d9f2df;
      color: #1f6f3d;
      font-weight: 600;
    }

    .dm-script-toolbar .dm-script-btn-share-live[data-state="hosting"]:hover {
      background: #c8e9d1;
    }

    .dm-script-toolbar .dm-script-btn-share-live[data-state="hosting"]:active {
      background: #b7dfc3;
    }

    .dm-script-toolbar .dm-script-btn-raise-hand[data-state="raised"] {
      background: #fff0c2;
      color: #765400;
      font-weight: 600;
    }

    .dm-script-toolbar .dm-script-btn-hands-raised[data-state="raised"] {
      background: #fff0c2;
      color: #765400;
      font-weight: 600;
    }

    .dm-script-toolbar .dm-script-btn-hands-raised[data-state="spotlight"] {
      background: #f8d8d5;
      color: #8f2e27;
      font-weight: 600;
    }

    .dm-script-toolbar .dm-script-btn-raise-hand[data-state="spotlight"] {
      background: #f8d8d5;
      color: #8f2e27;
      font-weight: 600;
    }

    .dm-script-toolbar .dm-script-btn[disabled] {
      opacity: 0.45;
      cursor: default;
      pointer-events: none;
    }

    .dm-script-toolbar .dm-script-btn .codicon {
      font-size: 16px;
      line-height: 1;
    }

    .dm-script-toolbar .dm-script-btn::after {
      content: attr(data-tooltip);
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      background: #f5f5f5;
      color: #3a3a3a;
      border: 1px solid #c7c7c7;
      border-radius: 10px;
      padding: 5px 11px;
      font-size: 12px;
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, 'Noto Sans', 'Liberation Sans', sans-serif;
      font-weight: 400;
      line-height: 1.2;
      white-space: nowrap;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      opacity: 0;
      visibility: hidden;
      transition: opacity 70ms ease-out;
      transition-delay: 20ms;
      pointer-events: none;
      z-index: 30;
    }

    .dm-script-toolbar .dm-script-btn:hover::after,
    .dm-script-toolbar .dm-script-btn:focus-visible::after {
      opacity: 1;
      visibility: visible;
    }

    .dm-script-toolbar .dm-script-btn.dm-script-btn-new .codicon.codicon-add {
      width: 14px;
      height: 14px;
      border: 1px solid currentColor;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      line-height: 1;
      box-sizing: border-box;
      font-weight: 400;
    }

    .dm-script-toolbar .dm-script-btn.icon-only {
      width: 24px;
      justify-content: center;
      padding: 0;
    }

    .dm-script-toolbar .dm-script-btn.dm-script-outline-btn {
      min-width: 112px;
      max-width: 190px;
    }

    .dm-script-toolbar .dm-script-btn.dm-script-outline-btn span:last-child {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dm-script-outline-popup {
      position: fixed;
      z-index: 1100;
      min-width: 260px;
      max-width: 420px;
      max-height: 360px;
      overflow: auto;
      background: #ffffff;
      border: 1px solid #cfcfcf;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
      border-radius: 8px;
      padding: 4px;
      box-sizing: border-box;
    }

    .dm-script-outline-popup-item {
      width: 100%;
      border: 0;
      background: transparent;
      text-align: left;
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 13px;
      color: #2d2d2d;
      cursor: pointer;
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, 'Noto Sans', 'Liberation Sans', sans-serif;
    }

    .dm-script-outline-popup-item:hover {
      background: #eef3ff;
    }

    .dm-script-outline-popup-item .codicon {
      font-size: 15px;
      line-height: 1;
      color: #555;
    }

    .dm-script-outline-popup-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dm-script-outline-popup-line {
      color: #6a6a6a;
      font-size: 12px;
      white-space: nowrap;
    }

    .dm-script-pathbar {
      height: 26px;
      flex: 0 0 26px;
      display: flex;
      align-items: center;
      box-sizing: border-box;
      padding: 0 10px;
      border-bottom: 1px solid #dcdcdc;
      background: #f8f8f8;
      color: #4a4a4a;
      font-size: 12px;
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, 'Noto Sans', 'Liberation Sans', sans-serif;
      min-width: 0;
    }

    .dm-script-pathbar-text {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dm-script-breadcrumbs {
      min-width: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      white-space: nowrap;
    }

    .dm-script-crumb {
      border: 0;
      background: transparent;
      padding: 0;
      margin: 0;
      color: #4a4a4a;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      text-decoration: none;
    }

    .dm-script-crumb:hover {
      text-decoration: underline;
    }

    .dm-script-sep {
      color: #7a7a7a;
      font-size: 12px;
      line-height: 1;
      user-select: none;
    }

    .dm-script-crumb-popup {
      position: fixed;
      z-index: 1000;
      min-width: 220px;
      max-width: 420px;
      max-height: 320px;
      overflow: auto;
      background: #ffffff;
      border: 1px solid #cfcfcf;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
      border-radius: 8px;
      padding: 4px;
    }

    .dm-script-crumb-popup-item {
      width: 100%;
      border: 0;
      background: transparent;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 13px;
      color: #2d2d2d;
      cursor: pointer;
    }

    .dm-script-crumb-popup-item:hover {
      background: #eef3ff;
    }

    .dm-script-crumb-popup-item .codicon {
      font-size: 15px;
      line-height: 1;
      color: #555;
    }

    .dm-script-tabs {
      height: 30px;
      flex: 0 0 30px;
      display: flex;
      align-items: stretch;
      gap: 0;
      overflow-x: auto;
      overflow-y: hidden;
      border-bottom: 1px solid #dcdcdc;
      background: #efefef;
    }

    .dm-script-tab {
      min-width: 120px;
      max-width: 260px;
      height: 29px;
      border: 0;
      border-right: 1px solid #d6d6d6;
      background: #efefef;
      color: #2f2f2f;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      cursor: pointer;
      font-size: 13px;
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, 'Noto Sans', 'Liberation Sans', sans-serif;
      box-sizing: border-box;
    }

    .dm-script-tab.active {
      background: #f8f8f8;
    }

    .dm-script-tab-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1 1 auto;
      text-align: left;
    }

    .dm-script-tab-close {
      border: 0;
      background: transparent;
      color: #616161;
      width: 18px;
      height: 18px;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      flex: 0 0 auto;
      font-size: 13px;
      line-height: 1;
    }

    .dm-script-tab-close:hover {
      background: #e5e5e5;
      color: #2f2f2f;
    }

    .dm-script-tab-live {
      flex: 0 0 auto;
      color: #315f91;
      font-size: 10px;
      line-height: 16px;
      white-space: nowrap;
    }

    .dm-script-tab-hand {
      flex: 0 0 auto;
      font-size: 10px;
      line-height: 16px;
      white-space: nowrap;
      font-weight: 600;
    }

    .dm-script-tab-hand--raised {
      color: #765400;
    }

    .dm-script-tab-hand--spotlight {
      color: #9f3028;
    }

    .dm-script-tab--ended,
    .dm-script-tab--ended.active {
      background: #fff5f3;
      box-shadow: inset 0 2px 0 #c24b3f;
    }

    .dm-script-tab--ended .dm-script-tab-live {
      color: #9f3028;
      font-weight: 600;
    }

    .dm-script-live-notice {
      flex: 0 0 auto;
      box-sizing: border-box;
      padding: 7px 12px;
      border-bottom: 1px solid #e1aaa4;
      background: #fff1ef;
      color: #7f2923;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.35;
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, 'Noto Sans', 'Liberation Sans', sans-serif;
    }

    .dm-script-live-notice[hidden] {
      display: none;
    }

    .dm-live-instructor-caret {
      border-left: 2px solid #2368a2;
      margin-left: -1px;
      box-sizing: border-box;
    }

    .dm-live-instructor-selection {
      background: rgba(35, 104, 162, 0.22);
    }

    .dm-live-panel[hidden] {
      display: none;
    }

    .dm-live-panel {
      position: fixed;
      inset: 0;
      z-index: 1200;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      pointer-events: none;
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, 'Noto Sans', 'Liberation Sans', sans-serif;
      color: #2f2f2f;
    }

    .dm-live-panel__dialog {
      width: min(440px, calc(100vw - 48px));
      max-height: min(680px, calc(100vh - 48px));
      background: #fff;
      border: 1px solid #d2d2d2;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.22);
      display: flex;
      flex-direction: column;
      pointer-events: auto;
    }

    .dm-live-panel__header {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid #d2d2d2;
      background: #f3f3f3;
    }

    .dm-live-panel__title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 600;
    }

    .dm-live-panel__body {
      overflow: auto;
      padding: 12px 12px 16px;
      background: #f6f6f6;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
    }

    .dm-live-panel__qr {
      width: 196px;
      height: 196px;
      align-self: center;
      border: 1px solid #d2d2d2;
      background: #fff;
    }

    .dm-live-panel__ticket {
      width: 100%;
      resize: vertical;
      box-sizing: border-box;
      border: 1px solid #c7c7c7;
      border-radius: 4px;
      padding: 7px 8px;
      background: #fff;
      color: #2f2f2f;
      font: 11px/1.4 'Fira Code', ui-monospace, monospace;
    }

    .dm-live-panel__nickname-label {
      display: flex;
      flex-direction: column;
      gap: 5px;
      color: #666;
      font-size: 12px;
    }

    .dm-live-panel__nickname {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #c7c7c7;
      border-radius: 4px;
      padding: 7px 8px;
      background: #fff;
      color: #2f2f2f;
      font: inherit;
      font-size: 12px;
    }

    .dm-live-panel__row {
      display: grid;
      grid-template-columns: 120px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      font-size: 12px;
    }

    .dm-live-panel__label {
      color: #666;
    }

    .dm-live-panel__value {
      overflow-wrap: anywhere;
    }

    .dm-live-panel__row--short-code .dm-live-panel__value {
      color: #1f6f3d;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .dm-live-panel__follow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
    }

    .dm-live-panel__hands {
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding-top: 10px;
      border-top: 1px solid #d7d7d7;
    }

    .dm-live-panel__hands-title {
      color: #666;
      font-size: 12px;
      font-weight: 600;
    }

    .dm-live-panel__hands-empty {
      color: #8a8a8a;
      font-size: 12px;
    }

    .dm-live-panel__hand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 7px 8px;
      border: 1px solid #d2d2d2;
      background: #fff;
    }

    .dm-live-panel__hand-name {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 600;
    }

    .dm-live-panel__hand-actions {
      flex: 0 0 auto;
      display: inline-flex;
      gap: 6px;
    }

    .dm-live-panel__hand .dm-live-panel__action {
      min-width: 68px;
      height: 26px;
      padding: 0 9px;
    }

    .dm-live-panel__message {
      min-height: 0;
      padding: 0 12px;
      background: #f6f6f6;
      color: #9a3131;
      font-size: 12px;
    }

    .dm-live-panel__message:not(:empty) {
      padding-bottom: 10px;
    }

    .dm-live-panel__footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 10px 12px 12px;
      border-top: 1px solid #d2d2d2;
      background: #f6f6f6;
    }

    .dm-live-panel__action {
      min-width: 88px;
      height: 30px;
      padding: 0 14px;
      border-radius: 6px;
      border: 1px solid #b8c6d5;
      background: linear-gradient(180deg, #ffffff 0%, #eef3f8 100%);
      color: #29415f;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .dm-live-panel__action:hover {
      border-color: #8ba3bb;
    }

    .dm-live-panel__action[disabled] {
      opacity: 0.45;
      cursor: default;
      pointer-events: none;
    }

    .dm-live-panel__action:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px rgba(143, 176, 212, 0.28);
    }

    .dm-live-panel__action--primary {
      border-color: #5f88b1;
      background: linear-gradient(180deg, #7ea8d3 0%, #5c87b3 100%);
      color: #fff;
    }

    .dm-live-panel__action--primary:hover {
      border-color: #4f769c;
    }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
